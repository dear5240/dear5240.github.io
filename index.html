<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>YunThinker docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="YunThinker 技术文档，包含环境搭建、使用说明与常见问题解答。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="YunThinker Docs">
  <meta property="og:description" content="YunThinker 技术文档，包含环境搭建、使用说明与常见问题解答。">
  <meta property="og:url" content="https://doc.yunthinker.com/">
  <meta property="og:image" content="https://doc.yunthinker.com/assets/share_logo.png">
  <meta property="og:site_name" content="YunThinker Docs">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="YunThinker Docs">
  <meta name="twitter:description" content="YunThinker 技术文档，包含环境搭建、使用说明与常见问题解答。">
  <meta name="twitter:image" content="https://doc.yunthinker.com/assets/share_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Docsify Theme CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/style.css">
  <!-- Favicon (SVG) - 通常放在样式之后 -->
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">


</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'YunThinker Docs',
      repo: '',
      loadNavbar: true,
      loadSidebar: true, // 确保启用侧边栏
      subMaxLevel: 4,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',  //自动搜索所有页面
        // paths: [
        //   '/',
        //   'docs/Environment/Env_1.md',
        // ], 
        placeholder: '搜索',
        noData: '找不到结果',
        depth: 6,
      },
      sidebarCollapse: {
        collapseAll: true,   // 默认全部折叠
        openLevel: 1,        // 进入页面时展开当前分组
      },
    }

  </script>
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- ************************************************ -->
  <!-- 回到顶部按钮 -->
  <button id="back-to-top" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <polyline points="18 15 12 9 6 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    </svg>
  </button>

  <script>
    (function () {
      var btn = document.getElementById('back-to-top');
      if (!btn) return;

      function toggle() {
        if (window.scrollY > 200) {
          btn.classList.add('show');
        } else {
          btn.classList.remove('show');
        }
      }

      // 显示/隐藏按钮
      window.addEventListener('scroll', toggle, { passive: true });
      // 对 docsify 页面切换，也检查一次（docsify 可能不触发完整重载）
      window.addEventListener('hashchange', toggle);

      // 点击平滑滚动到顶部
      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // 初始状态
      document.addEventListener('DOMContentLoaded', toggle);
    })();
  </script>
</body>
</html>
